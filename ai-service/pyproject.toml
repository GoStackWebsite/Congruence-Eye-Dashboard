[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "congruence-eye-ai"
version = "2.0.0"
description = "Congruence Eye edge AI vision service: YOLO + ByteTrack retail CCTV analytics (footfall, zones, queues, store ops)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9,<5",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "lap>=0.5", "torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
congruence-eye-ai = "congruence_eye_ai.__main__:main"
congruence-eye-sim = "congruence_eye_ai.simulate:main"

[tool.setuptools.packages.find]
include = ["congruence_eye_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx2.*"]

[tool.ruff]
line-length = 130
target-version = "py311"
