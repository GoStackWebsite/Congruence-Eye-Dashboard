# Congruence Eye SPA — nginx config used by the frontend Docker image.
# Serves the Angular build and proxies /api and /uploads to the backend service.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream ce_backend {
  server backend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 55m;   # photo / video (50 MB) / document / POS CSV uploads

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Server-Sent Events: no buffering, long read timeout
  location = /api/stream {
    proxy_pass http://ce_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://ce_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://ce_backend;
    proxy_set_header Host $host;
    expires 7d;
  }

  # PWA: the service worker, its manifest and the web manifest must always be revalidated
  location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Hashed bundles: cache forever
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # SPA fallback; index.html must never be cached so new deploys are picked up
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
